<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{CLIENT_NAME}} — cover</title>
<!-- design-system-kit 0.9.0 · template: the design system's cover.
     Generated by Setup, never drawn by hand: every colour, radius and space
     is a token from the preview bundle, so a token change restyles it.
     Setup fills three placeholders — the client name, the tagline (the
     brand's own line, or the brand book's one-sentence summary), and the
     motif: grid (plus marks), dots, lines or none, picked from the brand
     book and recorded in the comment inside the <svg>. A logo, when there is
     one, replaces the name: <img class="logo" src="../../assets/…" alt="{{CLIENT_NAME}}">. -->
<style>
html,body{margin:0;background:var(--background-normal)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--background-normal)}
.art{position:absolute;inset:0}
.motif{display:none}
.art[data-motif="grid"] .m-grid,.art[data-motif="dots"] .m-dots,.art[data-motif="lines"] .m-lines{display:inline}
.mark{stroke:var(--line-strong);stroke-width:1.5;stroke-linecap:round;fill:none}
.dot{fill:var(--line-strong)}
.rule{stroke:var(--line-normal);stroke-width:1}
.block{rx:var(--radius-xs);ry:var(--radius-xs)}
.b-primary{fill:var(--primary-normal)}
.b-secondary{fill:var(--secondary-normal)}
.b-status{fill:var(--status-positive)}
.b-neutral{fill:var(--fill-normal)}
.b-accent{fill:var(--accent-normal)}
.text{position:absolute;left:var(--space-12);bottom:var(--space-10);max-width:440px}
.name{margin:0;font-family:var(--font-display,var(--font-fallback-display)),var(--font-fallback-display);font-weight:700;font-size:72px;line-height:.92;letter-spacing:-0.015em;color:var(--label-strong,var(--label-normal))}
.logo{display:block;max-width:360px;max-height:96px}
.tag{margin:var(--space-3) 0 0;font-family:var(--font-sans,var(--font-fallback-sans)),var(--font-fallback-sans);font-size:14px;line-height:20px;color:var(--label-alternative)}
</style></head>
<body>
<div class="cover">
<svg class="art" data-motif="{{COVER_MOTIF}}" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- motif: {{COVER_MOTIF}} — why this one, from the brand book: {{COVER_MOTIF_REASON}}
     blocks: primary-normal 192×192, secondary-normal 192×96, status-positive 96×96, fill-normal 288×48, an accent-normal disc;
     a grid at space-12 (48px) pitch on the right half, blocks flush to it and bleeding off the top and right edges -->
<defs>
<pattern id="cover-grid" x="456" y="-24" width="48" height="48" patternUnits="userSpaceOnUse"><path class="mark" d="M20 24h8M24 20v8"/></pattern>
<pattern id="cover-dots" x="480" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="12" cy="12" r="1.5"/></pattern>
<pattern id="cover-lines" x="480" y="0" width="48" height="12" patternUnits="userSpaceOnUse"><path class="rule" d="M0 11.5h48"/></pattern>
</defs>
<rect class="motif m-grid" x="480" y="0" width="480" height="288" fill="url(#cover-grid)"/>
<rect class="motif m-dots" x="480" y="0" width="480" height="288" fill="url(#cover-dots)"/>
<rect class="motif m-lines" x="480" y="0" width="480" height="288" fill="url(#cover-lines)"/>
<rect class="block b-primary" x="576" y="0" width="192" height="192"/>
<rect class="block b-secondary" x="768" y="0" width="192" height="96"/>
<rect class="block b-status" x="768" y="96" width="96" height="96"/>
<rect class="block b-neutral" x="576" y="192" width="288" height="48"/>
<circle class="b-accent" cx="768" cy="192" r="24"/>
</svg>
<div class="text"><h1 class="name">{{CLIENT_NAME}}</h1><p class="tag">{{COVER_TAGLINE}}</p></div>
</div>
</body>
</html>
